# ============================================================
# LMS 本地/单机部署编排
#
# 所有密钥均来自环境变量（可放在同目录的 .env 文件中，已被 .gitignore 忽略）。
# 请先复制 .env.example 为 .env 并填写真实值，再执行：
#   docker compose up -d --build
# ============================================================
services:

  # 1. 后端应用（内嵌已构建的前端静态资源）
  lms-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/lms-backend-0.0.1-SNAPSHOT.jar
    container_name: lms-backend-container
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-lms_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-lmsuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置（见 .env.example）}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none   # 表结构由 Flyway 版本化迁移管理
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（见 .env.example）}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: always

  # 2. MySQL 数据库
  mysql-db:
    image: mysql:8.0
    container_name: lms-mysql-container
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置（见 .env.example）}
      MYSQL_USER: ${MYSQL_USER:-lmsuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置（见 .env.example）}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

volumes:
  db-data:
