# ============================================================
# LMS 后端配置
# 敏感项一律通过环境变量注入，仓库内不保存任何真实密钥。
# 变量清单见仓库根目录 .env.example
# ============================================================

# 1. 服务端口
server.port=${SERVER_PORT:8080}

# 2. MySQL 数据源
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate（表结构由 Flyway 迁移管理，禁止 Hibernate 自动改表）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. JWT 密钥（生产环境必须通过 JWT_SECRET 注入；下方默认值仅供本地开发）
app.jwt.secret=${JWT_SECRET:LOCAL_DEV_ONLY_CHANGE_ME_ThisIsMyNewUltraSecureKeyForMyNPUProject123456789}
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# 5. 邮件（163 邮箱 SMTP）
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:songmingli721@163.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
# 避免 SMTP 不可达时长时间阻塞请求线程
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 关闭时仅打印日志不真正投递（本地无 SMTP 凭据时可用）
app.mail.enabled=${APP_MAIL_ENABLED:true}

# 6. Flyway 版本化迁移（替代 Hibernate ddl-auto 自动建表）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 7. 登录失败锁定
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.security.lock-duration-minutes=${LOCK_DURATION_MINUTES:15}

# 8. CORS 允许来源（逗号分隔；支持通配 pattern，如 https://*.example.com）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
