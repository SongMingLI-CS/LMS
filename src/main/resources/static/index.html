<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆管理系统 (LMS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        /* 样式保持不变 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        .sidebar-link.active { background-color: #3b82f6; color: #ffffff; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }

        /* 添加一个简单的加载动画 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

<div id="app" class="flex h-screen overflow-hidden">

    <transition name="fade">
        <div v-if="isLoading" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black bg-opacity-70">
            <div class="spinner"></div>
            <p class="text-white text-lg mt-4">请稍候...</p>
        </div>
    </transition>

    <div v-if="!currentUser" class="w-full h-screen flex bg-white">

        <div class="hidden lg:flex w-1/2 h-full items-center justify-center p-12"
             style="background-image: url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1974&q=80'); background-size: cover; background-position: center;">

            <div class="text-center bg-black bg-opacity-50 p-8 rounded-lg shadow-xl">
                <h1 class="text-white text-4xl font-bold mb-4">LMS 图书馆管理系统</h1>
                <p class="text-gray-200 text-lg">西北工业大学 | 软件工程</p>
            </div>
        </div>

        <div class="w-full lg:w-1/2 h-full flex items-center justify-center p-8 bg-gray-50 overflow-y-auto">

            <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-2xl">

                <transition name="fade" mode="out-in">

                    <div v-if="!isRegistering" key="login">
                        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">系统登录</h2>
                        <form @submit.prevent="handleLogin">
                            <div class="mb-4">
                                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">学号 / 用户名</label>
                                <input type="text" id="username" v-model="loginForm.username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入学号或管理员账号" required>
                            </div>
                            <div class="mb-6">
                                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                                <input type="password" id="password" v-model="loginForm.password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入密码" required>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">
                                登 录
                            </button>
                            <p v-if="loginError" class="text-red-500 text-sm text-center mt-4">{{ loginError }}</p>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#" @click.prevent="isRegistering = true" class="text-sm text-blue-600 hover:underline">
                                还没有账号？立即注册
                            </a>
                        </div>
                    </div>

                    <div v-else key="register">
                        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">用户注册</h2>
                        <form @submit.prevent="handleRegister">
                            <div class="mb-4">
                                <label for="reg-username" class="block text-sm font-medium text-gray-700 mb-2">学号 (唯一)</label>
                                <input type="text" id="reg-username" v-model="registerForm.username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入您的学号" required>
                            </div>
                            <div class="mb-4">
                                <label for="reg-name" class="block text-sm font-medium text-gray-700 mb-2">姓名</label>
                                <input type="text" id="reg-name" v-model="registerForm.name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入您的真实姓名" required>
                            </div>
                            <div class="mb-4">
                                <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                                <input type="password" id="reg-password" v-model="registerForm.password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入密码" required>
                            </div>
                            <div class="mb-6">
                                <label for="reg-confirm" class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
                                <input type="password" id="reg-confirm" v-model="registerForm.confirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="再次输入密码" required>
                            </div>
                            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition duration-300">
                                注 册
                            </button>
                            <p v-if="registerError" class="text-red-500 text-sm text-center mt-4">{{ registerError }}</p>
                        </form>
                        <div class="mt-6 text-center">
                            <a href="#" @click.prevent="isRegistering = false" class="text-sm text-blue-600 hover:underline">
                                已有账号？返回登录
                            </a>
                        </div>
                    </div>
                </transition>

            </div>
        </div>
    </div>

    <template v-if="currentUser">
        <aside :class="['bg-gray-900 text-gray-200 transition-all duration-300', isSidebarOpen ? 'w-64' : 'w-20']">
            <div class="flex flex-col h-full">
                <div class="flex items-center justify-between h-16 px-4 border-b border-gray-700">
                    <span v-if="isSidebarOpen" class="text-xl font-bold text-white">LMS 系统</span>
                    <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-lg text-gray-300 hover:bg-gray-700 focus:outline-none">
                        <ion-icon :name="isSidebarOpen ? 'chevron-back-outline' : 'chevron-forward-outline'" class="text-2xl"></ion-icon>
                    </button>
                </div>
                <nav class="flex-1 overflow-y-auto py-4">
                    <a v-for="page in visiblePages" :key="page.id"
                       href="#"
                       @click.prevent="currentPage = page.id"
                       :class="['sidebar-link flex items-center py-3 px-4 transition-colors duration-200 hover:bg-gray-700', currentPage === page.id ? 'active' : '']">
                        <ion-icon :name="page.icon" class="text-2xl" :class="[isSidebarOpen ? 'mr-3' : 'mx-auto']"></ion-icon>
                        <span v-if="isSidebarOpen" class="font-medium">{{ page.title }}</span>
                    </a>
                </nav>
                <div class="p-4 border-t border-gray-700">
                    <div class="flex items-center" :class="[isSidebarOpen ? '' : 'justify-center']">
                        <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-white">
                            {{ currentUser.name.charAt(0) }}
                        </div>
                        <div v-if="isSidebarOpen" class="ml-3">
                            <p class="text-sm font-semibold text-white">{{ currentUser.name }}</p>
                            <p class="text-xs text-gray-400">{{ getRoleName(currentUser.role) }}</p>
                        </div>
                    </div>
                    <button @click="handleLogout"
                            :class="['w-full flex items-center justify-center mt-4 py-2 rounded-lg text-red-300 hover:bg-red-700 hover:text-white transition-colors duration-200', isSidebarOpen ? 'px-4' : '']">
                        <ion-icon name="log-out-outline" class="text-2xl" :class="[isSidebarOpen ? 'mr-3' : '']"></ion-icon>
                        <span v-if="isSidebarOpen" class="font-medium">退出登录</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white shadow-md flex items-center justify-between px-6">
                <h1 class="text-2xl font-semibold text-gray-800">{{ currentPageTitle }}</h1>
                <div class="text-sm text-gray-600">
                    欢迎您, <span class="font-medium text-blue-600">{{ currentUser.name }}</span>
                </div>
            </header>

            <div class="flex-1 overflow-x-hidden overflow-y-auto p-6 bg-gray-100">
                <transition name="fade" mode="out-in">
                    <div :key="currentPage">

                        <section v-if="currentPage === 'dashboard'">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                <div class="p-6 bg-white rounded-lg shadow-lg flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-500">我的借阅</p>
                                        <p class="text-3xl font-bold text-gray-800">{{ myBorrowCount }}</p>
                                    </div>
                                    <div class="w-12 h-12 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full">
                                        <ion-icon name="book-outline" class="text-2xl"></ion-icon>
                                    </div>
                                </div>
                                <div class="p-6 bg-white rounded-lg shadow-lg flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-500">我的预约</p>
                                        <p class="text-3xl font-bold text-gray-800">{{ myReservationCount }}</p>
                                    </div>
                                    <div class="w-12 h-12 flex items-center justify-center bg-green-100 text-green-600 rounded-full">
                                        <ion-icon name="alarm-outline" class="text-2xl"></ion-icon>
                                    </div>
                                </div>
                                <div v-if="currentUser.role !== 'user'" class="p-6 bg-white rounded-lg shadow-lg flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-500">图书总数</p>
                                        <p class="text-3xl font-bold text-gray-800">{{ totalBookCount }}</p>
                                    </div>
                                    <div class="w-12 h-12 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-full">
                                        <ion-icon name="library-outline" class="text-2xl"></ion-icon>
                                    </div>
                                </div>
                                <div v-if="currentUser.role !== 'user'" class="p-6 bg-white rounded-lg shadow-lg flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-500">用户总数</p>
                                        <p class="text-3xl font-bold text-gray-800">{{ totalUserCount }}</p>
                                    </div>
                                    <div class="w-12 h-12 flex items-center justify-center bg-yellow-100 text-yellow-600 rounded-full">
                                        <ion-icon name="people-outline" class="text-2xl"></ion-icon>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-8 p-6 bg-white rounded-lg shadow-lg">
                                <h3 class="text-xl font-semibold mb-4">欢迎使用图书管理系统</h3>
                                <p class="text-gray-600">
                                    您可以在左侧的导航栏中选择需要的功能。作为{{ getRoleName(currentUser.role) }}，
                                    <span v-if="currentUser.role === 'user'">您可以浏览图书、管理您的借阅和预约。</span>
                                    <span v-if="currentUser.role === 'admin'">您可以管理图书信息、处理借还操作、查看借阅记录和数据分析报告。</span>
                                    <span v-if="currentUser.role === 'superadmin'">您拥有所有权限，包括管理其他用户账号。</span>
                                </p>
                            </div>
                        </section>

                        <section v-if="currentPage === 'browseBooks'">
                            <div class="mb-6 p-4 bg-white rounded-lg shadow">
                                <div class="flex space-x-4">
                                    <input type="text" v-model="bookSearchQuery" placeholder="按书名、作者或ISBN搜索..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <button @click="clearBookSearch" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
                                        清空
                                    </button>
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow overflow-hidden">
                                <table class="w-full table-auto">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">封面</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">书名</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">作者</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ISBN</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">
                                    <tr v-if="!isLoading && filteredBooks.length === 0">
                                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">暂无图书数据</td>
                                    </tr>
                                    <tr v-if="isLoading && filteredBooks.length === 0">
                                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">正在加载图书...</td>
                                    </tr>
                                    <tr v-for="book in filteredBooks" :key="book.id" class="hover:bg-gray-50">
                                        <td class="px-6 py-4">
                                            <img :src="book.cover" alt="封面" class="w-12 h-16 object-cover rounded" @error="({ target }) => target.src = 'https://placehold.co/150x200/6b7280/white?text=%E6%97%A0%E5%9B%BE%E7%89%87'">
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ book.title }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ book.author }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ book.isbn }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap">
<span v-if="book.available > 0" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
可借阅 ({{ book.available }})
</span>
                                            <span v-else class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">
已借完
</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                            <button v-if="book.available > 0" @click="handleBorrow(book)" class="px-3 py-1 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                                                借阅
                                            </button>
                                            <button v-else @click="handleReserve(book)" class="px-3 py-1 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">
                                                预约
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section v-if="currentPage === 'manageBooks'">
                            <div class="mb-6 p-4 bg-white rounded-lg shadow flex justify-between items-center">
                                <div class="flex space-x-4">
                                    <input type="text" v-model="bookSearchQuery" placeholder="按书名、作者或ISBN搜索..." class="w-72 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <button @click="clearBookSearch" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
                                        清空
                                    </button>
                                </div>
                                <button @click="openBookModal(null)" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center">
                                    <ion-icon name="add-outline" class="mr-1"></ion-icon> 图书入库
                                </button>
                            </div>
                            <div class="bg-white rounded-lg shadow overflow-x-auto">
                                <table class="w-full table-auto">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">封面</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">书名</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">作者</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ISBN</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总库存</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">可借阅</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">
                                    <tr v-if="!isLoading && filteredBooks.length === 0">
                                        <td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无图书数据</td>
                                    </tr>
                                    <tr v-if="isLoading && filteredBooks.length === 0">
                                        <td colspan="7" class="px-6 py-4 text-center text-gray-500">正在加载图书...</td>
                                    </tr>
                                    <tr v-for="book in filteredBooks" :key="book.id" class="hover:bg-gray-50">
                                        <td class="px-6 py-4">
                                            <img :src="book.cover" alt="封面" class="w-12 h-16 object-cover rounded" @error="({ target }) => target.src = 'https://placehold.co/150x200/6b7280/white?text=%E6%97%A0%E5%9B%BE%E7%89%87'">
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ book.title }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ book.author }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ book.isbn }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ book.stock }}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium" :class="book.available < 5 ? 'text-red-500' : 'text-green-600'">
                                            {{ book.available }}
                                            <span v-if="book.available < 5" class="text-xs text-red-500">(库存预警)</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                            <button @click="openBookModal(book)" class="px-3 py-1 bg-blue-500 text-white rounded-lg hover:bg-blue-600">编辑</button>
                                            <button @click="handleDeleteBook(book)" class="px-3 py-1 bg-red-500 text-white rounded-lg hover:bg-red-600">出库/删除</button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section v-if="currentPage === 'manageBorrow'">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="p-6 bg-white rounded-lg shadow-lg">
                                    <h3 class="text-xl font-semibold mb-4">图书归还处理</h3>
                                    <div class="space-y-4">
                                        <input type="text" v-model="returnBookId" placeholder="输入要归还的图书ID或ISBN..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <input type="text" v-model="returnUserId" placeholder="输入归还用户的ID (可选)..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <button @click="handleReturn" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                            确认归还
                                        </button>
                                    </div>
                                </div>
                                <div class="p-6 bg-white rounded-lg shadow-lg">
                                    <h3 class="text-xl font-semibold mb-4">待处理预约</h3>
                                    <div v-if="pendingReservations.length === 0" class="text-gray-500">
                                        暂无待处理的预约。
                                    </div>
                                    <ul v-else class="divide-y divide-gray-200">
                                        <li v-for="res in pendingReservations" :key="res.id" class="py-3 flex justify-between items-center">
                                            <div>
                                                <p class="font-medium">{{ getBookById(res.bookId)?.title }}</p>
                                                <p class="text-sm text-gray-500">预约人: {{ getUserById(res.userId)?.name }} | {{ res.date }}</p>
                                            </div>
                                            <button @click="handleProcessReservation(res)" class="px-3 py-1 bg-green-500 text-white rounded-lg hover:bg-green-600">
                                                处理
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <section v-if="currentPage === 'records'">
                            <div class="bg-white rounded-lg shadow overflow-x-auto">
                                <table class="w-full table-auto">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th v-if="currentUser.role !== 'user'" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">书名</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">借阅日期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">应还日期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">

<script>
    // 导入 Vue 的所有必要函数
    const { createApp, ref, computed, onMounted, reactive } = Vue;

    createApp({
        setup() {
// --- 响应式状态 (State) ---

// 认证与导航
            const currentUser = ref(null);
            const loginForm = reactive({ username: '', password: '' });
            const loginError = ref('');
            const currentPage = ref('dashboard');
            const isSidebarOpen = ref(true);

            // 【修改】Top 5 状态 (由 API 填充)
            const popularBooks = ref([]);
            const activeUsers = ref([]);

            // 【新增】为新的真实数据图表添加 ref
            const categoryStats = ref([]);
            const peakTimeStats = ref([]);
            const overdueUsers = ref([]);
            const stagnantBooks = ref([]);

// 注册表单
            const isRegistering = ref(false);
            const registerForm = reactive({ username: '', name: '', password: '', confirmPassword: '' });
            const registerError = ref('');

// 全局加载状态
            const isLoading = ref(false);

// 弹窗
            const isModalOpen = ref(false);
            const modalType = ref('');
            const alertMessage = reactive({ title: '', text: '', type: 'success' });

// 搜索
            const bookSearchQuery = ref('');
            const userSearchQuery = ref('');

// 借还管理
            const returnBookId = ref('');
            const returnUserId = ref('');

// --- 前端数据缓存 ---
            const users = ref([]);
            const books = ref([]);
            const borrowRecords = ref([]);


// --- 2. 配置 Axios API 实例 ---
            const api = axios.create({
                baseURL: '/',
                timeout: 10000,
            });

// Axios 拦截器 (用于发送认证 Token)
            api.interceptors.request.use(config => {
                const token = localStorage.getItem('token');
                if (token) {
                    config.headers.Authorization = `Bearer ${token}`;
                }
                return config;
            }, error => {
                return Promise.reject(error);
            });


// 表单数据 (默认值)
            const defaultBook = { id: null, title: '', author: '', isbn: '', stock: 1, available: 1, cover: '' };
            const currentBook = reactive({ ...defaultBook });

            const defaultUser = { id: null, username: '', name: '', password: '', role: 'user' };
            const currentUserForm = reactive({ ...defaultUser });

// --- 页面定义 (Navigation) ---
            const allPages = [
                { id: 'dashboard', title: '仪表盘', icon: 'grid-outline', roles: ['user', 'admin', 'superadmin'] },
                { id: 'browseBooks', title: '图书浏览', icon: 'search-outline', roles: ['user'] },
                { id: 'manageBooks', title: '图书管理', icon: 'library-outline', roles: ['admin', 'superadmin'] },
                { id: 'manageBorrow', title: '借还管理', icon: 'swap-horizontal-outline', roles: ['admin', 'superadmin'] },
                { id: 'records', title: '借阅记录', icon: 'document-text-outline', roles: ['user', 'admin', 'superadmin'] },
                { id: 'manageUsers', title: '用户管理', icon: 'people-outline', roles: ['superadmin'] },
                { id: 'analysis', title: '数据分析', icon: 'bar-chart-outline', roles: ['admin', 'superadmin'] },
            ];

// --- 计算属性 (Computed) ---

            // 【修正】修正 visiblePages 计算属性，确保正确处理 ROLE_ 前缀
            const visiblePages = computed(() => {
                if (!currentUser.value) return [];
                const rawRole = currentUser.value.role || '';
                // 清理角色：去除 ROLE_ 前缀并转为小写 (例如得到 "superadmin")
                const cleanRole = rawRole.replace(/ROLE_/gi, '').toLowerCase();
                // 使用清理后的角色进行匹配
                return allPages.filter(p => p.roles.includes(cleanRole));
            });

            const currentPageTitle = computed(() => {
                return allPages.find(p => p.id === currentPage.value)?.title || '仪表盘';
            });
            const filteredBooks = computed(() => {
                const query = bookSearchQuery.value.toLowerCase();
                if (!query) return books.value;
                return books.value.filter(b =>
                    b.title.toLowerCase().includes(query) ||
                    b.author.toLowerCase().includes(query) ||
                    b.isbn.toLowerCase().includes(query)
                );
            });
            const filteredUsers = computed(() => {
                const query = userSearchQuery.value.toLowerCase();
                if (!query) return users.value;
                return users.value.filter(u =>
                    u.username.toLowerCase().includes(query) ||
                    u.name.toLowerCase().includes(query) ||
                    (u.id && u.id.toString().toLowerCase().includes(query)) // 添加 u.id 检查
                );
            });
            const filteredRecords = computed(() => {
                if (!currentUser.value) return [];
                // 【修正】使用清理后的角色进行判断
                const cleanRole = (currentUser.value.role || '').replace(/ROLE_/gi, '').toLowerCase();
                if (cleanRole === 'user') {
                    return borrowRecords.value.filter(r => r.userId === currentUser.value.id);
                }
                return borrowRecords.value;
            });
            const pendingReservations = computed(() => {
                return borrowRecords.value.filter(r => r.status === 'reserved');
            });

// 仪表盘统计
            const myBorrowCount = computed(() => {
                if (!currentUser.value) return 0;
                return borrowRecords.value.filter(r => r.userId === currentUser.value.id && r.status === 'borrowed').length;
            });
            const myReservationCount = computed(() => {
                if (!currentUser.value) return 0;
                return borrowRecords.value.filter(r => r.userId === currentUser.value.id && r.status === 'reserved').length;
            });
            const totalBookCount = computed(() => books.value.length);
            const totalUserCount = computed(() => users.value.length);


            // 在所有其他 computed 属性下方添加此属性
            const pieChartStyle = computed(() => {
                if (categoryStats.value.length === 0) return '';

                // 1. 计算总数量
                const total = categoryStats.value.reduce((sum, item) => sum + item.count, 0);
                if (total === 0) return '';

                let currentAngle = 0;
                // 定义一个颜色数组，防止颜色重复
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#6b7280'];
                const segments = [];

                categoryStats.value.forEach((item, index) => {
                    // 计算当前分类占用的百分比 (360度中的角度)
                    const percentage = item.count / total;
                    const endAngle = currentAngle + percentage * 360;

                    // 生成 CSS 片段: color start_angle end_angle
                    segments.push(`${colors[index % colors.length]} ${currentAngle}deg ${endAngle}deg`);

                    currentAngle = endAngle;
                });

                // 返回最终的 CSS 样式字符串
                return `conic-gradient(${segments.join(', ')})`;
            });
            // 【注意】 popularBooks 和 activeUsers 已被移除 computed，改为顶部的 ref()


// 模拟分析数据 (保留，用于图表占位)
            const analysisData = ref({
                peakHours: [
                    { time: '9-11', count: 60 },
                    { time: '11-13', count: 40 },
                    { time: '13-15', count: 80 },
                    { time: '15-17', count: 75 },
                    { time: '17-19', count: 50 },
                ]
            });


// --- 辅助方法 (Helpers) ---
            const getRoleName = (role) => {
                if (!role) return '未知';
                const roles = { user: '普通用户', admin: '管理员', superadmin: '超级管理员' };
                let cleanRole = role.replace(/ROLE_/gi, '').toLowerCase();
                return roles[cleanRole] || '未知';
            };
            const showMessage = (title, text, type = 'success') => {
                alertMessage.title = title;
                alertMessage.text = text;
                alertMessage.type = type;
                modalType.value = 'alert';
                isModalOpen.value = true;
            };
            const closeModal = () => {
                isModalOpen.value = false;
                modalType.value = '';
                Object.assign(currentBook, defaultBook, { id: null });
                Object.assign(currentUserForm, defaultUser, { id: null });
            };
            const getToday = () => new Date().toISOString().split('T')[0];
            const getFutureDate = (days) => {
                const date = new Date();
                date.setDate(date.getDate() + days);
                return date.toISOString().split('T')[0];
            };
            const isOverdue = (dueDate) => {
                if (!dueDate) return false;
                const today = new Date(getToday());
                const due = new Date(dueDate);
                return due < today;
            };
// ID查找 (依赖前端缓存)
            const getBookById = (id) => books.value.find(b => b.id === id);
            const getUserById = (id) => users.value.find(u => u.id === id);
            const clearBookSearch = () => bookSearchQuery.value = '';


// --- 3. 数据获取 (API) ---

            // 【新增】获取数据分析的方法
            // 【替换】使用这个新版本的 fetchAnalysisData
            const fetchAnalysisData = async () => {
                try {
                    await Promise.all([
                        // 1. 热门图书
                        api.get('/api/records/analysis/popular-books')
                            .then(res => { popularBooks.value = res.data; }),

                        // 2. 活跃读者
                        api.get('/api/records/analysis/active-users')
                            .then(res => { activeUsers.value = res.data; }),

                        // 3. 图书分类 (真实数据)
                        api.get('/api/books/analysis/categories')
                            .then(res => { categoryStats.value = res.data; }),

                        // 4. 高峰时段 (真实数据)
                        api.get('/api/records/analysis/peak-times')
                            .then(res => { peakTimeStats.value = res.data; }),

                        // 5. 逾期读者 (V2 需求)
                        api.get('/api/records/analysis/overdue-users')
                            .then(res => { overdueUsers.value = res.data; }),

                        // 6. 滞销图书 (V2 需求)
                        api.get('/api/books/analysis/stagnant-books')
                            .then(res => { stagnantBooks.value = res.data; })
                    ]);
                } catch (error) {
                    console.error("加载分析数据失败:", error);
                    showMessage('加载失败', '无法获取数据分析报告。', 'error');
                }
            };

            // 【修改】fetchAllData (添加了 fetchAnalysisData)
            const fetchAllData = async () => {
                isLoading.value = true;
                try {
                    await Promise.all([
                        fetchBooks(),
                        fetchUsers(),
                        fetchRecords(),
                        fetchAnalysisData() // <--- 【关键新增点】
                    ]);
                } catch (error) {
                    console.error("加载初始数据失败:", error);
                    showMessage('加载失败', '无法连接到服务器获取核心数据。', 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const fetchBooks = async () => {
                try {
                    const response = await api.get('/api/books');
                    books.value = response.data;
                } catch (error) {
                    console.error("获取图书失败:", error);
                    showMessage('加载失败', '无法获取图书列表。', 'error');
                }
            };

            const fetchUsers = async () => {
                // 【修正】使用清理后的角色进行判断
                const cleanRole = (currentUser.value?.role || '').replace(/ROLE_/gi, '').toLowerCase();
                if (cleanRole === 'user') {
                    users.value = [];
                    return;
                }
                try {
                    const response = await api.get('/api/users');
                    users.value = response.data;
                } catch (error) {
                    console.error("获取用户失败:", error);
                    if (cleanRole !== 'user') {
                        showMessage('加载失败', '无法获取用户列表。', 'error');
                    }
                }
            };

            const fetchRecords = async () => {
                try {
                    const response = await api.get('/api/records');
                    borrowRecords.value = response.data;
                } catch (error) {
                    console.error("获取记录失败:", error);
                    showMessage('加载失败', '无法获取借阅记录。', 'error');
                }
            };

// --- 核心业务逻辑 (API) ---

// 1. 认证
            const handleLogin = async () => {
                isLoading.value = true;
                loginError.value = '';
                try {
                    const response = await api.post('/login', loginForm);

                    if (response.data && response.data.token && response.data.user) {
                        localStorage.setItem('token', response.data.token);

                        // 【修正】在设置 currentUser 之前清理角色
                        let user = response.data.user;
                        user.role = (user.role || '').replace(/ROLE_/gi, '').toLowerCase();

                        currentUser.value = user;

                        loginForm.username = '';
                        loginForm.password = '';
                        currentPage.value = 'dashboard';

                        // 登录成功后, 加载所有数据
                        await fetchAllData();

                    } else {
                        loginError.value = '登录失败：服务器返回数据格式不正确。';
                    }
                } catch (error) {
                    console.error("登录失败:", error);
                    if (error.response && (error.response.status === 401 || error.response.status === 403)) {
                        loginError.value = '学号或密码错误！';
                    } else {
                        loginError.value = '登录失败，无法连接到服务器。';
                    }
                } finally {
                    isLoading.value = false;
                }
            };

// 2. 注册
            const handleRegister = async () => {
                registerError.value = '';
                if (registerForm.password !== registerForm.confirmPassword) {
                    registerError.value = '两次输入的密码不一致！';
                    return;
                }
                isLoading.value = true;
                try {
                    const payload = {
                        username: registerForm.username,
                        name: registerForm.name,
                        password: registerForm.password
                    };
                    await api.post('/register', payload);

                    showMessage('注册成功', '您现在可以使用学号和密码登录了。');
                    isRegistering.value = false;
                    registerError.value = '';
                    Object.assign(registerForm, { username: '', name: '', password: '', confirmPassword: '' });

                } catch (error) {
                    console.error("注册失败:", error);
                    if (error.response && error.response.status === 409) {
                        registerError.value = '注册失败：该学号已被注册！';
                    } else {
                        registerError.value = '注册失败，请稍后再试。';
                    }
                } finally {
                    isLoading.value = false;
                }
            };


            const handleLogout = () => {
                currentUser.value = null;
                localStorage.removeItem('token');
                currentPage.value = 'dashboard';
                books.value = [];
                users.value = [];
                borrowRecords.value = [];
                popularBooks.value = []; // 清空分析数据
                activeUsers.value = [];  // 清空分析数据
            };

// 2. 图书管理
            const openBookModal = (book) => {
                if (book) {
                    Object.assign(currentBook, book);
                } else {
                    Object.assign(currentBook, defaultBook, { id: null });
                }
                modalType.value = 'book';
                isModalOpen.value = true;
            };

            const handleSaveBook = async () => {
                isLoading.value = true;
                try {
                    if (currentBook.id) {
                        await api.put(`/api/books/${currentBook.id}`, currentBook);
                    } else {
                        await api.post('/api/books', currentBook);
                    }
                    showMessage('操作成功', '图书信息已保存');
                    closeModal();
                    await fetchBooks();
                } catch (error) {
                    console.error("保存图书失败:", error);
                    showMessage('操作失败', '无法保存图书到服务器。', 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleDeleteBook = async (book) => {
                if (confirm(`确认要删除/出库图书 《${book.title}》 吗？`)) {
                    isLoading.value = true;
                    try {
                        await api.delete(`/api/books/${book.id}`);
                        showMessage('操作成功', `《${book.title}》 已删除`);
                        await fetchBooks();
                    } catch (error) {
                        console.error("删除图书失败:", error);
                        showMessage('操作失败', '无法从服务器删除该图书。', 'error');
                    } finally {
                        isLoading.value = false;
                    }
                }
            };

// 3. 用户管理
            const openUserModal = (user) => {
                if (user) {
                    // 【修正】确保在编辑时使用清理后的角色
                    const cleanRole = (user.role || '').replace(/ROLE_/gi, '').toLowerCase();
                    Object.assign(currentUserForm, user, { password: '', role: cleanRole });
                } else {
                    Object.assign(currentUserForm, defaultUser, { id: null });
                }
                modalType.value = 'user';
                isModalOpen.value = true;
            };

            const handleSaveUser = async () => {
                isLoading.value = true;
                try {
                    const userData = { ...currentUserForm };
                    if (!userData.password) {
                        delete userData.password;
                    }

                    if (userData.id) {
                        await api.put(`/api/users/${userData.id}`, userData);
                    } else {
                        await api.post('/api/users', userData);
                    }
                    showMessage('操作成功', '用户信息已保存');
                    closeModal();
                    await fetchUsers();
                } catch (error) {
                    console.error("保存用户失败:", error);
                    showMessage('操作失败', '无法保存用户到服务器。', 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleDeleteUser = async (user) => {
                if (user.id === currentUser.value.id) {
                    showMessage('操作失败', '不能删除自己', 'error');
                    return;
                }
                if (confirm(`确认要删除用户 ${user.name} (${user.username}) 吗？`)) {
                    isLoading.value = true;
                    try {
                        await api.delete(`/api/users/${user.id}`);
                        showMessage('操作成功', `用户 ${user.name} 已删除`);
                        await fetchUsers();
                    } catch (error) {
                        console.error("删除用户失败:", error);
                        showMessage('操作失败', '无法从服务器删除该用户。', 'error');
                    } finally {
                        isLoading.value = false;
                    }
                }
            };

// 4. 借还逻辑 (API)
            const handleBorrow = async (book) => {
                isLoading.value = true;
                try {
                    await api.post('/api/records/borrow', { bookId: book.id });
                    showMessage('借阅成功', `《${book.title}》 已借阅。`);
                    await fetchAllData();
                } catch (error) {
                    console.error("借阅失败:", error);
                    const errorMsg = error.response?.data?.message || '操作失败，请稍后再试。';
                    showMessage('借阅失败', errorMsg, 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleReserve = async (book) => {
                isLoading.value = true;
                try {
                    await api.post('/api/records/reserve', { bookId: book.id });
                    showMessage('预约成功', `《${book.title}》 已预约。`);
                    await fetchAllData();
                } catch (error) {
                    console.error("预约失败:", error);
                    const errorMsg = error.response?.data?.message || '您已预约过此书或操作失败。';
                    showMessage('预约失败', errorMsg, 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleRenew = async (record) => {
                isLoading.value = true;
                try {
                    await api.put(`/api/records/renew/${record.id}`);
                    showMessage('续借成功', '续借申请已通过。');
                    await fetchRecords();
                } catch (error) {
                    console.error("续借失败:", error);
                    const errorMsg = error.response?.data?.message || '续借失败，可能已达续借次数。';
                    showMessage('续借失败', errorMsg, 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleReturn = async () => {
                const bookIdentifier = returnBookId.value.trim();
                if (!bookIdentifier) {
                    showMessage('归还失败', '请输入图书ID或ISBN', 'error');
                    return;
                }
                isLoading.value = true;
                try {
                    const payload = {
                        bookIdentifier: bookIdentifier,
                        userId: returnUserId.value.trim() || null
                    };
                    await api.post('/api/records/return', payload);
                    showMessage('归还成功', '图书已成功归还。');
                    returnBookId.value = '';
                    returnUserId.value = '';
                    await fetchAllData();
                } catch (error) {
                    console.error("归还失败:", error);
                    const errorMsg = error.response?.data?.message || '未找到该书的借阅记录。';
                    showMessage('归还失败', errorMsg, 'error');
                } finally {
                    isLoading.value = false;
                }
            };

            const handleProcessReservation = async (reservation) => {
                isLoading.value = true;
                try {
                    await api.post(`/api/records/process-reservation/${reservation.id}`);
                    showMessage('处理成功', '已成功为用户办理借阅。');
                    await fetchAllData();
                } catch (error) {
                    console.error("处理预约失败:", error);
                    const errorMsg = error.response?.data?.message || '处理失败，可能库存不足。';
                    showMessage('处理失败', errorMsg, 'error');
                } finally {
                    isLoading.value = false;
                }
            };

// --- onMounted (自动登录检查) ---
            onMounted(() => {
                const token = localStorage.getItem('token');
                if (token) {
                    // 模拟从 token 解析用户（在真实应用中，您会验证 token 或获取 /me 接口）
                    // 为了演示，我们重新加载所有数据
                    // 在 handleLogin 中加载数据更合适，这里我们假设 token 有效
                    // handleLogin(); // 实际应用中不应自动登录
                }
            });


// --- 返回 setup 对象 ---
            return {
                // 状态
                currentUser,
                loginForm,
                loginError,
                currentPage,
                isSidebarOpen,
                isModalOpen,
                modalType,
                alertMessage,
                bookSearchQuery,
                userSearchQuery,
                returnBookId,
                returnUserId,
                currentBook,
                currentUserForm,
                analysisData,
                isRegistering,
                registerForm,
                registerError,
                isLoading,
                categoryStats, // 暴露给模板
                peakTimeStats, // 暴露给模板

                // 计算属性
                visiblePages,
                currentPageTitle,
                filteredBooks,
                filteredUsers,
                filteredRecords,
                pendingReservations,
                myBorrowCount,
                myReservationCount,
                totalBookCount,
                totalUserCount,
                popularBooks,
                activeUsers,
                categoryStats,
                peakTimeStats,
                overdueUsers,
                stagnantBooks,

                // 方法
                handleLogin,
                handleLogout,
                getRoleName,
                closeModal,
                clearBookSearch,
                isOverdue,
                getBookById,
                getUserById,
                handleRegister,

                // 业务方法
                openBookModal,
                handleSaveBook,
                handleDeleteBook,
                openUserModal,
                handleSaveUser,
                handleDeleteUser,
                handleBorrow,
                handleReserve,
                handleRenew,
                handleReturn,
                handleProcessReservation,
            };
        }
    }).mount('#app');
</script>

</body>
</html>
