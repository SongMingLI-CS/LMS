<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS 图书馆管理系统 (修复版)</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .sidebar-glass { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px); }

        /* 动画类 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        .slide-up-enter-active, .slide-up-leave-active { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up-enter-from, .slide-up-leave-to { opacity: 0; transform: translateY(20px); }
        .list-enter-active, .list-leave-active { transition: all 0.4s ease; }
        .list-enter-from, .list-leave-to { opacity: 0; transform: translateX(30px); }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* 侧边栏激活条 */
        .sidebar-link { position: relative; overflow: hidden; }
        .sidebar-link::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: #6366f1; transform: scaleY(0); transition: transform 0.2s;
        }
        .sidebar-link.active { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .sidebar-link.active::before { transform: scaleY(1); }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden selection:bg-primary-500 selection:text-white">

<div id="app" class="flex h-full">

    <div v-if="isLoading" class="fixed top-0 left-0 w-full h-1 z-[100] overflow-hidden">
        <div class="h-full bg-primary-500 animate-[loading_1.5s_ease-in-out_infinite]" style="width: 50%"></div>
    </div>
    <style>@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }</style>

    <div class="fixed top-6 right-6 z-[110] flex flex-col gap-3 pointer-events-none">
        <transition-group name="list">
            <div v-for="toast in toasts" :key="toast.id"
                 :class="['pointer-events-auto min-w-[300px] p-4 rounded-xl shadow-2xl border-l-4 flex items-start backdrop-blur-md bg-white/95',
                 toast.type === 'error' ? 'border-red-500' : 'border-green-500']">
                <ion-icon :name="toast.type === 'error' ? 'alert-circle' : 'checkmark-circle'"
                          :class="['text-2xl mr-3', toast.type === 'error' ? 'text-red-500' : 'text-green-500']"></ion-icon>
                <div>
                    <h4 class="font-bold text-sm text-gray-900">{{ toast.title }}</h4>
                    <p class="text-xs text-gray-600 mt-1">{{ toast.text }}</p>
                </div>
            </div>
        </transition-group>
    </div>

    <div v-if="!currentUser" class="w-full h-full flex relative bg-slate-50">
        <div class="hidden lg:flex lg:w-3/5 relative overflow-hidden bg-slate-900 items-center justify-center">
            <div class="absolute inset-0 bg-gradient-to-br from-primary-900 to-slate-900"></div>
            <div class="absolute top-0 left-0 w-full h-full opacity-20"
                 style="background-image: radial-gradient(#6366f1 1px, transparent 1px); background-size: 30px 30px;"></div>

            <div class="relative z-10 text-center text-white p-12">
                <div class="w-20 h-20 bg-primary-500/20 backdrop-blur-sm rounded-3xl flex items-center justify-center mx-auto mb-8 border border-primary-500/30">
                    <ion-icon name="library" class="text-5xl text-primary-400"></ion-icon>
                </div>
                <h1 class="text-5xl font-bold mb-6 tracking-tight">LMS 图书馆系统</h1>
                <p class="text-xl text-slate-300 font-light">西北工业大学 | 软件工程课程设计</p>
            </div>
        </div>

        <div class="w-full lg:w-2/5 flex items-center justify-center p-8 relative">
            <div class="w-full max-w-[400px]">
                <transition name="fade" mode="out-in">
                    <div v-if="!isRegistering && !isVerificationStep && !isForgotPassword" key="login">
                        <h2 class="text-3xl font-bold text-slate-900 mb-2">欢迎回来</h2>
                        <p class="text-slate-500 mb-8">请输入您的账号信息以继续</p>

                        <form @submit.prevent="handleLogin" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">账号</label>
                                <input type="text" v-model="loginForm.username" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition" placeholder="学号 / 用户名" required>
                            </div>
                            <div>
                                <div class="flex justify-between mb-1">
                                    <label class="block text-xs font-bold text-slate-500 uppercase">密码</label>
                                    <a href="#" @click.prevent="isForgotPassword=true; clearErrors()" class="text-xs text-primary-600 hover:underline">忘记密码?</a>
                                </div>
                                <input type="password" v-model="loginForm.password" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none transition" placeholder="您的密码" required>
                            </div>

                            <button type="submit" :disabled="isLoading" class="w-full py-3 bg-primary-600 text-white rounded-xl font-bold shadow-lg hover:bg-primary-700 transition disabled:opacity-70">
                                {{ isLoading ? '登录中...' : '立即登录' }}
                            </button>

                            <div v-if="loginError" class="p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center">
                                <ion-icon name="alert-circle" class="mr-2 text-lg"></ion-icon> {{ loginError }}
                            </div>
                        </form>
                        <p class="mt-6 text-center text-sm text-slate-500">
                            没有账号？ <a href="#" @click.prevent="isRegistering=true; clearErrors()" class="text-primary-600 font-bold hover:underline">立即注册</a>
                        </p>
                    </div>

                    <div v-else-if="isRegistering && !isVerificationStep" key="register">
                        <h2 class="text-3xl font-bold text-slate-900 mb-6">创建账号</h2>
                        <form @submit.prevent="handleRegister" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" v-model="registerForm.username" placeholder="学号 (唯一)" class="px-4 py-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required>
                                <input type="text" v-model="registerForm.name" placeholder="真实姓名" class="px-4 py-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required>
                            </div>
                            <input type="email" v-model="registerForm.email" placeholder="电子邮箱" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required>
                            <input type="password" v-model="registerForm.password" placeholder="设置密码" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required>
                            <input type="password" v-model="registerForm.confirmPassword" placeholder="确认密码" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-primary-500 outline-none" required>

                            <button type="submit" class="w-full py-3 bg-green-600 text-white rounded-xl font-bold shadow-lg hover:bg-green-700 transition">发送验证码</button>
                            <p v-if="registerError" class="text-red-500 text-sm text-center">{{ registerError }}</p>
                        </form>
                        <button @click="isRegistering=false; clearErrors()" class="w-full mt-4 text-sm text-slate-500 hover:text-slate-800">返回登录</button>
                    </div>

                    <div v-else-if="isVerificationStep" key="verify" class="text-center">
                        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-3xl"><ion-icon name="mail-open"></ion-icon></div>
                        <h2 class="text-2xl font-bold mb-2">输入验证码</h2>
                        <p class="text-slate-500 mb-6">已发送至 {{ registerForm.email }}</p>
                        <form @submit.prevent="handleVerification">
                            <input type="text" v-model="verificationCode" class="w-full text-center text-3xl tracking-widest font-bold py-3 border-b-2 border-slate-200 focus:border-primary-500 outline-none mb-6" placeholder="000000" maxlength="6" required>
                            <button type="submit" class="w-full py-3 bg-primary-600 text-white rounded-xl font-bold">激活账户</button>
                        </form>
                        <button @click="isVerificationStep=false" class="mt-4 text-sm text-slate-400">上一步</button>
                    </div>

                    <div v-else-if="isForgotPassword" key="forgot">
                        <h2 class="text-2xl font-bold mb-6">重置密码</h2>
                        <form v-if="!resetForm.codeSent" @submit.prevent="handleForgotPassword">
                            <input type="email" v-model="resetForm.email" placeholder="注册邮箱" class="w-full px-4 py-3 border rounded-xl mb-4" required>
                            <button class="w-full py-3 bg-orange-500 text-white rounded-xl font-bold">发送重置码</button>
                        </form>
                        <form v-else @submit.prevent="handleResetPassword" class="space-y-4">
                            <input type="text" v-model="resetForm.code" placeholder="验证码" class="w-full px-4 py-3 border rounded-xl">
                            <input type="password" v-model="resetForm.newPassword" placeholder="新密码" class="w-full px-4 py-3 border rounded-xl">
                            <button class="w-full py-3 bg-primary-600 text-white rounded-xl font-bold">重置密码</button>
                        </form>
                        <button @click="isForgotPassword=false" class="w-full mt-4 text-sm text-slate-500">取消</button>
                    </div>
                </transition>
            </div>
        </div>
    </div>

    <template v-if="currentUser">
        <aside :class="['sidebar-glass text-slate-300 transition-all duration-300 z-20 flex flex-col shadow-2xl', isSidebarOpen ? 'w-64' : 'w-20']">
            <div class="h-20 flex items-center px-6 border-b border-slate-700/50">
                <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center flex-shrink-0 shadow-lg shadow-primary-500/40">
                    <ion-icon name="library" class="text-white text-lg"></ion-icon>
                </div>
                <span v-if="isSidebarOpen" class="ml-3 font-bold text-lg text-white tracking-wide whitespace-nowrap">LMS 系统</span>
            </div>

            <nav class="flex-1 py-6 space-y-1 overflow-y-auto custom-scrollbar">
                <a v-for="page in visiblePages" :key="page.id" href="#" @click.prevent="currentPage = page.id"
                   :class="['sidebar-link flex items-center px-6 py-3.5 transition-colors duration-200 hover:bg-white/5', currentPage === page.id ? 'active' : 'text-slate-400 hover:text-white']">
                    <ion-icon :name="page.icon" class="text-xl flex-shrink-0" :class="[isSidebarOpen ? 'mr-3' : 'mx-auto text-2xl']"></ion-icon>
                    <span v-if="isSidebarOpen" class="font-medium text-sm whitespace-nowrap">{{ page.title }}</span>
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700/50 bg-slate-900/50">
                <div class="flex items-center" :class="[isSidebarOpen ? '' : 'justify-center']">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold shadow-inner flex-shrink-0">
                        {{ currentUser.name.charAt(0) }}
                    </div>
                    <div v-if="isSidebarOpen" class="ml-3 overflow-hidden">
                        <p class="text-sm font-medium text-white truncate">{{ currentUser.name }}</p>
                        <p class="text-xs text-slate-500 truncate">{{ getRoleName(currentUser.role) }}</p>
                    </div>
                </div>
                <button @click="handleLogout" class="mt-4 w-full flex items-center justify-center py-2 rounded-lg text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition">
                    <ion-icon name="log-out-outline" class="text-xl" :class="[isSidebarOpen ? 'mr-2' : '']"></ion-icon>
                    <span v-if="isSidebarOpen" class="text-xs font-medium">退出</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">
            <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-10">
                <div class="flex items-center">
                    <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500 mr-4">
                        <ion-icon name="menu-outline" class="text-2xl"></ion-icon>
                    </button>
                    <h1 class="text-xl font-bold text-slate-800">{{ currentPageTitle }}</h1>
                </div>
            </header>

            <div class="flex-1 overflow-x-hidden overflow-y-auto p-8 custom-scrollbar">
                <transition name="slide-up" mode="out-in">
                    <div :key="currentPage" class="max-w-7xl mx-auto pb-10">

                        <section v-if="currentPage === 'dashboard'">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                <div class="glass-panel p-6 rounded-2xl shadow-sm hover:shadow-md transition relative overflow-hidden group">
                                    <div class="relative z-10"><p class="text-sm font-medium text-slate-500 mb-1">我的借阅</p><p class="text-3xl font-bold text-slate-800">{{ myBorrowCount }}</p></div>
                                    <div class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-primary-50 rounded-xl flex items-center justify-center text-primary-600"><ion-icon name="book" class="text-2xl"></ion-icon></div>
                                </div>
                                <div class="glass-panel p-6 rounded-2xl shadow-sm hover:shadow-md transition relative overflow-hidden group">
                                    <div class="relative z-10"><p class="text-sm font-medium text-slate-500 mb-1">我的预约</p><p class="text-3xl font-bold text-slate-800">{{ myReservationCount }}</p></div>
                                    <div class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-orange-500"><ion-icon name="bookmark" class="text-2xl"></ion-icon></div>
                                </div>
                                <template v-if="currentUser.role !== 'user'">
                                    <div class="glass-panel p-6 rounded-2xl shadow-sm hover:shadow-md transition relative overflow-hidden group">
                                        <div class="relative z-10"><p class="text-sm font-medium text-slate-500 mb-1">馆藏总数</p><p class="text-3xl font-bold text-slate-800">{{ totalBookCount }}</p></div>
                                        <div class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600"><ion-icon name="library" class="text-2xl"></ion-icon></div>
                                    </div>
                                    <div class="glass-panel p-6 rounded-2xl shadow-sm hover:shadow-md transition relative overflow-hidden group">
                                        <div class="relative z-10"><p class="text-sm font-medium text-slate-500 mb-1">库存预警</p><p class="text-3xl font-bold" :class="lowStockBooks.length>0?'text-red-600':'text-slate-800'">{{ lowStockBooks.length }}</p></div>
                                        <div class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><ion-icon name="alert-circle" class="text-2xl"></ion-icon></div>
                                    </div>
                                </template>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-2 glass-panel p-8 rounded-2xl shadow-sm">
                                    <h3 class="text-lg font-bold text-slate-800 mb-4">系统概况</h3>
                                    <div class="p-6 bg-gradient-to-r from-primary-50 to-white rounded-xl border border-primary-100 flex items-start">
                                        <ion-icon name="information-circle" class="text-2xl text-primary-600 mr-4 mt-1"></ion-icon>
                                        <div class="text-slate-600 leading-relaxed">
                                            欢迎您，<span class="font-bold text-primary-700">{{ currentUser.name }}</span>。
                                            您当前身份为 <span class="px-2 py-0.5 bg-slate-200 rounded text-xs font-bold text-slate-700">{{ getRoleName(currentUser.role) }}</span>。
                                            系统运行正常，所有服务在线。
                                        </div>
                                    </div>
                                </div>
                                <div v-if="lowStockBooks.length > 0 && currentUser.role !== 'user'" class="glass-panel p-6 rounded-2xl shadow-sm border-t-4 border-red-500">
                                    <h3 class="font-bold text-slate-800 mb-4 flex items-center"><ion-icon name="warning" class="text-red-500 mr-2"></ion-icon> 补货提醒</h3>
                                    <ul class="space-y-3">
                                        <li v-for="book in lowStockBooks.slice(0,5)" :key="book.id" class="flex justify-between items-center text-sm">
                                            <span class="truncate w-2/3 text-slate-600">{{ book.title }}</span>
                                            <span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs font-bold">剩 {{ book.available }}</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <section v-if="currentPage === 'manageBooks'">
                            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                                <div class="relative w-full md:w-96 group">
                                    <ion-icon name="search" class="absolute left-3 top-3 text-slate-400"></ion-icon>
                                    <input type="text" v-model="bookSearchQuery" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 outline-none" placeholder="搜索书名、作者、ISBN...">
                                </div>
                                <div v-if="currentUser.role !== 'user'" class="flex gap-3">
                                    <button @click="openBookModal(null)" class="flex items-center px-4 py-2.5 bg-primary-600 text-white rounded-xl hover:bg-primary-700 shadow-md transition">
                                        <ion-icon name="add" class="mr-1.5 text-lg"></ion-icon> 新增图书
                                    </button>
                                    <button @click="modalType='importBooks'; isModalOpen=true" class="flex items-center px-4 py-2.5 bg-white text-slate-700 border border-slate-200 rounded-xl hover:bg-slate-50 transition">
                                        <ion-icon name="cloud-upload-outline" class="mr-1.5 text-lg"></ion-icon> 导入
                                    </button>
                                </div>
                            </div>

                            <div class="glass-panel rounded-2xl shadow-sm overflow-hidden">
                                <table class="w-full text-left border-collapse">
                                    <thead class="bg-slate-50 border-b border-slate-100 text-xs uppercase text-slate-500 font-semibold">
                                    <tr>
                                        <th class="px-6 py-4">图书信息</th>
                                        <th class="px-6 py-4">作者/ISBN</th>
                                        <th class="px-6 py-4">状态</th>
                                        <th class="px-6 py-4 text-right">操作</th>
                                    </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                    <tr v-for="book in filteredBooks" :key="book.id" class="hover:bg-slate-50/80 transition duration-150">
                                        <td class="px-6 py-4 flex items-center">
                                            <img :src="book.cover" class="h-12 w-9 bg-slate-200 rounded object-cover mr-4" @error="$event.target.src='https://via.placeholder.com/150?text=Book'">
                                            <span class="font-medium text-slate-800">{{ book.title }}</span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="text-sm text-slate-900">{{ book.author }}</div>
                                            <div class="text-xs text-slate-400 mt-0.5">{{ book.isbn }}</div>
                                        </td>
                                        <td class="px-6 py-4">
                                                <span :class="['px-2.5 py-0.5 rounded-full text-xs font-medium', book.available > 0 ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700']">
                                                    {{ book.available > 0 ? `可借 ${book.available}` : '暂无库存' }}
                                                </span>
                                        </td>
                                        <td class="px-6 py-4 text-right space-x-2">
                                            <button v-if="book.available > 0 && !isBookBorrowedByUser(book)" @click="handleBorrow(book)" class="text-sm text-primary-600 font-medium hover:underline">借阅</button>
                                            <button v-if="book.available === 0 && !isBookBorrowedByUser(book) && !isBookReservedByUser(book)" @click="handleReserve(book)" class="text-sm text-orange-500 font-medium hover:underline">预约</button>
                                            <span v-if="isBookBorrowedByUser(book)" class="text-xs text-slate-400">已借阅</span>

                                            <template v-if="currentUser.role !== 'user'">
                                                <button @click="openBookModal(book)" class="p-1 text-slate-400 hover:text-primary-600"><ion-icon name="create-outline"></ion-icon></button>
                                                <button @click="handleDeleteBook(book)" class="p-1 text-slate-400 hover:text-red-600"><ion-icon name="trash-outline"></ion-icon></button>
                                            </template>
                                        </td>
                                    </tr>
                                    <tr v-if="filteredBooks.length === 0"><td colspan="4" class="px-6 py-12 text-center text-slate-400">无相关记录</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section v-if="currentPage === 'analysis'">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div class="glass-panel p-6 rounded-2xl shadow-sm">
                                    <div class="flex justify-between mb-4"><h3 class="font-bold">借阅热度 TOP5</h3><button @click="handleExportAnalysis('popular-books','pop.xlsx')"><ion-icon name="download-outline"></ion-icon></button></div>
                                    <div class="relative h-64"><canvas id="chartPopularBooks"></canvas></div>
                                </div>
                                <div class="glass-panel p-6 rounded-2xl shadow-sm">
                                    <div class="flex justify-between mb-4"><h3 class="font-bold">分类占比</h3><button @click="handleExportAnalysis('categories','cats.xlsx')"><ion-icon name="download-outline"></ion-icon></button></div>
                                    <div class="relative h-64 flex justify-center"><canvas id="chartCategories"></canvas></div>
                                </div>
                            </div>
                        </section>

                        <section v-if="currentPage === 'records'">
                            <div class="glass-panel rounded-2xl shadow-sm overflow-x-auto p-6">
                                <h3 class="text-lg font-bold mb-4">借阅历史</h3>
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="p-4">图书</th><th class="p-4">借出时间</th><th class="p-4">应还时间</th><th class="p-4">状态</th><th class="p-4 text-right">操作</th></tr></thead>
                                    <tbody class="divide-y divide-slate-100">
                                    <tr v-for="rec in filteredRecords" :key="rec.id">
                                        <td class="p-4 font-medium">{{ rec.bookTitle }}</td>
                                        <td class="p-4 text-slate-500 text-sm">{{ rec.borrowDate }}</td>
                                        <td class="p-4 text-slate-500 text-sm">{{ rec.dueDate }}</td>
                                        <td class="p-4"><span :class="['px-2 py-1 rounded text-xs font-bold', isOverdue(rec.dueDate) ? 'bg-red-100 text-red-700' : 'bg-blue-50 text-blue-700']">{{ rec.status }}</span></td>
                                        <td class="p-4 text-right"><button v-if="rec.status==='borrowed' && currentUser.role==='user'" @click="handleRenew(rec)" class="text-primary-600 text-sm hover:underline">续借</button></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        <section v-if="currentPage === 'manageBorrow'">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div class="glass-panel p-8 rounded-2xl shadow-sm">
                                    <h3 class="font-bold text-lg mb-4">图书归还</h3>
                                    <div class="space-y-4">
                                        <input v-model="returnBookId" placeholder="ISBN / 图书ID" class="w-full px-4 py-3 border rounded-xl">
                                        <input v-model="returnUserId" placeholder="用户 ID (可选)" class="w-full px-4 py-3 border rounded-xl">
                                        <button @click="handleReturn" class="w-full py-3 bg-primary-600 text-white rounded-xl font-bold">确认归还</button>
                                    </div>
                                </div>
                                <div class="glass-panel p-8 rounded-2xl shadow-sm">
                                    <h3 class="font-bold text-lg mb-4">待处理预约</h3>
                                    <ul>
                                        <li v-for="res in pendingReservations" :key="res.id" class="p-4 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center mb-2">
                                            <div><div class="font-bold">{{ getBookById(res.bookId)?.title }}</div><div class="text-xs text-slate-400">{{ getUserById(res.userId)?.name }}</div></div>
                                            <button @click="handleProcessReservation(res)" class="px-3 py-1 bg-green-500 text-white text-xs rounded">批准</button>
                                        </li>
                                        <li v-if="pendingReservations.length===0" class="text-slate-400 text-center">无待处理预约</li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <section v-if="currentPage === 'profile'" class="max-w-2xl mx-auto">
                            <div class="glass-panel p-8 rounded-2xl shadow-lg">
                                <h3 class="text-xl font-bold text-slate-800 mb-6 border-b pb-4">账户设置</h3>
                                <form @submit.prevent="handleUpdateProfile" class="mb-8">
                                    <label class="block text-sm font-medium text-slate-700 mb-2">显示名称</label>
                                    <div class="flex gap-4">
                                        <input type="text" v-model="profileForm.name" class="flex-1 px-4 py-2 border rounded-xl outline-none">
                                        <button class="bg-primary-600 text-white px-6 py-2 rounded-xl">保存</button>
                                    </div>
                                </form>
                                <button @click="modalType='password'; isModalOpen=true" class="text-primary-600 hover:underline">修改登录密码</button>
                            </div>
                        </section>

                    </div>
                </transition>
            </div>
        </main>
    </template>

    <transition name="fade">
        <div v-if="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm" @click.self="closeModal">
            <transition name="slide-up" appear>
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 m-4 max-h-[90vh] overflow-y-auto relative">
                    <button @click="closeModal" class="absolute top-4 right-4 text-2xl text-slate-400 hover:text-slate-600"><ion-icon name="close-outline"></ion-icon></button>

                    <div v-if="modalType === 'book'">
                        <h3 class="text-2xl font-bold mb-6">{{ currentBook.id ? '编辑图书' : '新书入库' }}</h3>
                        <form @submit.prevent="handleSaveBook" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="col-span-2"><label class="text-xs font-bold text-slate-500">书名</label><input v-model="currentBook.title" class="w-full mt-1 px-3 py-2 border rounded-lg" required></div>
                                <div><label class="text-xs font-bold text-slate-500">作者</label><input v-model="currentBook.author" class="w-full mt-1 px-3 py-2 border rounded-lg" required></div>
                                <div><label class="text-xs font-bold text-slate-500">ISBN</label><input v-model="currentBook.isbn" class="w-full mt-1 px-3 py-2 border rounded-lg" required></div>
                                <div><label class="text-xs font-bold text-slate-500">库存</label><input type="number" v-model.number="currentBook.stock" class="w-full mt-1 px-3 py-2 border rounded-lg" :disabled="!!currentBook.id"></div>
                                <div><label class="text-xs font-bold text-slate-500">可借</label><input type="number" v-model.number="currentBook.available" class="w-full mt-1 px-3 py-2 border rounded-lg" :disabled="!!currentBook.id"></div>
                                <div class="col-span-2"><label class="text-xs font-bold text-slate-500">封面 URL</label><input v-model="currentBook.cover" class="w-full mt-1 px-3 py-2 border rounded-lg"></div>
                            </div>
                            <button type="submit" class="w-full py-2 bg-primary-600 text-white rounded-lg mt-4">保存</button>
                        </form>
                    </div>

                    <div v-if="modalType === 'importBooks'">
                        <h3 class="text-xl font-bold mb-4">批量导入</h3>
                        <input type="file" @change="handleFileSelect" accept=".xlsx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100"/>
                        <button @click="handleUploadBooks" :disabled="!selectedFile" class="w-full mt-6 py-2 bg-primary-600 text-white rounded-lg disabled:opacity-50">开始上传</button>
                    </div>

                    <div v-if="modalType === 'password'">
                        <h3 class="text-xl font-bold mb-4">修改密码</h3>
                        <form @submit.prevent="handleChangePassword" class="space-y-3">
                            <input type="password" v-model="passwordForm.oldPassword" placeholder="当前密码" class="w-full px-3 py-2 border rounded-lg">
                            <input type="password" v-model="passwordForm.newPassword" placeholder="新密码" class="w-full px-3 py-2 border rounded-lg">
                            <input type="password" v-model="passwordForm.confirmPassword" placeholder="确认新密码" class="w-full px-3 py-2 border rounded-lg">
                            <button class="w-full py-2 bg-primary-600 text-white rounded-lg">确认修改</button>
                        </form>
                    </div>
                </div>
            </transition>
        </div>
    </transition>

</div>

<script>
    const { createApp, ref, computed, reactive, nextTick, watch } = Vue;

    createApp({
        setup() {
            // --- 状态定义 ---
            const currentUser = ref(null);
            const loginForm = reactive({ username: '', password: '' });
            const loginError = ref('');
            const currentPage = ref('dashboard');
            const isSidebarOpen = ref(true);
            const toasts = ref([]);

            // 数据
            const books = ref([]);
            const users = ref([]);
            const borrowRecords = ref([]);
            const popularBooks = ref([]);
            const categoryStats = ref([]);
            const lowStockBooks = ref([]);
            const isLoading = ref(false);

            // 表单与模态框
            const isModalOpen = ref(false);
            const modalType = ref('');
            const currentBook = reactive({});
            const bookSearchQuery = ref('');
            const isRegistering = ref(false);
            const isVerificationStep = ref(false);
            const isForgotPassword = ref(false);
            const registerForm = reactive({ username: '', name: '', password: '', confirmPassword: '', email: '' });
            const verificationCode = ref('');
            const registerError = ref('');
            const resetForm = reactive({ email: '', code: '', newPassword: '', codeSent: false });
            const profileForm = reactive({ name: '' });
            const passwordForm = reactive({ oldPassword: '', newPassword: '', confirmPassword: '' });
            const selectedFile = ref(null);
            const returnBookId = ref('');
            const returnUserId = ref('');

            // API 配置
            const api = axios.create({ baseURL: '/', timeout: 8000 });
            api.interceptors.request.use(config => {
                const token = localStorage.getItem('token');
                if (token) config.headers.Authorization = `Bearer ${token}`;
                return config;
            });

            // --- 核心逻辑 ---
            let toastId = 0;
            const showMessage = (title, text, type = 'success') => {
                const id = toastId++;
                toasts.value.push({ id, title, text, type });
                setTimeout(() => toasts.value = toasts.value.filter(t => t.id !== id), 3000);
            };

            const clearErrors = () => { loginError.value = ''; registerError.value = ''; };
            const getRoleName = (role) => ({ user: '读者', admin: '管理员', superadmin: '超管' }[(role||'').replace('ROLE_','').toLowerCase()] || '未知');

            const fetchAllData = async () => {
                isLoading.value = true;
                try {
                    await api.get('/api/books').then(r => books.value = r.data);
                    await api.get('/api/records').then(r => borrowRecords.value = r.data);
                    // 非关键数据允许失败
                    api.get('/api/records/analysis/popular-books').then(r => popularBooks.value = r.data).catch(()=>{});
                    api.get('/api/books/analysis/categories').then(r => categoryStats.value = r.data).catch(()=>{});
                    api.get('/api/books/low-stock').then(r => lowStockBooks.value = r.data).catch(()=>{});
                    if (currentUser.value.role !== 'user') api.get('/api/users').then(r => users.value = r.data).catch(()=>{});
                } catch (e) { showMessage('提示', '部分数据加载失败', 'error'); }
                finally { isLoading.value = false; }
            };

            // 图表渲染
            const renderCharts = async () => {
                await nextTick();
                if (document.getElementById('chartPopularBooks')) {
                    new Chart(document.getElementById('chartPopularBooks'), {
                        type: 'bar',
                        data: { labels: popularBooks.value.map(b=>b.title), datasets: [{ label: '借阅量', data: popularBooks.value.map(b=>b.borrowCount), backgroundColor: '#6366f1', borderRadius: 4 }] },
                        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
                    });
                }
                if (document.getElementById('chartCategories')) {
                    new Chart(document.getElementById('chartCategories'), {
                        type: 'doughnut',
                        data: { labels: categoryStats.value.map(c=>c.category), datasets: [{ data: categoryStats.value.map(c=>c.count), backgroundColor: ['#6366f1','#10b981','#f59e0b'] }] },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }
            };
            watch(currentPage, (v) => { if(v==='analysis') renderCharts(); });

            // --- 操作函数 ---
            const handleLogin = async () => {
                isLoading.value = true;
                try {
                    const res = await api.post('/login', loginForm);
                    localStorage.setItem('token', res.data.token);
                    currentUser.value = res.data.user;
                    profileForm.name = res.data.user.name;
                    await fetchAllData();
                } catch(e) { loginError.value = '登录失败'; }
                finally { isLoading.value = false; }
            };

            const handleLogout = () => { currentUser.value = null; localStorage.removeItem('token'); };

            const handleBorrow = async (book) => {
                try { await api.post('/api/records/borrow', { bookId: book.id }); showMessage('成功', '借阅成功'); await fetchAllData(); } catch(e) { showMessage('失败', '无法借阅', 'error'); }
            };
            const handleReserve = async (book) => {
                try { await api.post('/api/records/reserve', { bookId: book.id }); showMessage('成功', '预约成功'); await fetchAllData(); } catch(e) { showMessage('失败', '无法预约', 'error'); }
            };
            const handleRenew = async (rec) => {
                try { await api.put(`/api/records/renew/${rec.id}`); showMessage('成功', '续借成功'); await fetchAllData(); } catch(e) { showMessage('失败', '无法续借', 'error'); }
            };
            const handleDeleteBook = async (book) => {
                if(confirm('确认删除?')) {
                    try { await api.delete(`/api/books/${book.id}`); showMessage('成功', '已删除'); await fetchAllData(); } catch(e) { showMessage('失败', '删除失败', 'error'); }
                }
            };
            const handleProcessReservation = async (res) => {
                try { await api.post(`/api/records/process-reservation/${res.id}`); showMessage('成功', '已批准'); await fetchAllData(); } catch(e) { showMessage('失败', '操作失败', 'error'); }
            };

            // 其他逻辑
            const handleRegister = async () => { /* 简化演示:直接成功 */ isVerificationStep.value=true; };
            const handleVerification = async () => {isRegistering.value = false;isVerificationStep.value = false;showMessage('成功', '注册成功');
            };
            const handleReturn = async () => { try { await api.post('/api/records/return', { bookIdentifier: returnBookId.value }); showMessage('成功','归还成功'); await fetchAllData(); } catch(e){ showMessage('失败','归还失败','error'); }};
            const handleSaveBook = async () => {
                try {
                    if(currentBook.id) await api.put(`/api/books/${currentBook.id}`, currentBook);
                    else await api.post('/api/books', currentBook);
                    closeModal(); await fetchAllData(); showMessage('成功','已保存');
                } catch(e){ showMessage('失败','保存失败','error'); }
            };
            const handleUploadBooks = async () => { /* 上传逻辑 */ showMessage('提示','演示模式:上传逻辑已触发'); closeModal(); };
            const handleUpdateProfile = async () => { currentUser.value.name = profileForm.name; showMessage('成功','资料已更新'); };
            const handleChangePassword = async () => { showMessage('成功','密码已修改'); closeModal(); };
            const handleExportAnalysis = () => showMessage('提示','正在下载...');

            // 辅助
            const isOverdue = (d) => new Date(d) < new Date();
            const isBookBorrowedByUser = (b) => borrowRecords.value.some(r=>r.bookId===b.id && r.userId===currentUser.value.id && r.status==='borrowed');
            const isBookReservedByUser = (b) => borrowRecords.value.some(r=>r.bookId===b.id && r.userId===currentUser.value.id && r.status==='reserved');
            const getBookById = (id) => books.value.find(b=>b.id===id);
            const getUserById = (id) => users.value.find(u=>u.id===id);
            const openBookModal = (b) => { Object.assign(currentBook, b || {stock:1, available:1}); modalType.value='book'; isModalOpen.value=true; };
            const closeModal = () => isModalOpen.value = false;
            const handleFileSelect = (e) => selectedFile.value = e.target.files[0];

            // 计算属性
            const filteredBooks = computed(() => books.value.filter(b => b.title.includes(bookSearchQuery.value)));
            const filteredRecords = computed(() => currentUser.value.role === 'user' ? borrowRecords.value.filter(r=>r.userId===currentUser.value.id) : borrowRecords.value);
            const visiblePages = computed(() => [
                {id:'dashboard',title:'仪表盘',icon:'grid',roles:['user','admin','superadmin']},
                {id:'manageBooks',title:'图书库',icon:'library',roles:['user','admin','superadmin']},
                {id:'records',title:'借阅记录',icon:'time',roles:['user','admin','superadmin']},
                {id:'manageBorrow',title:'借还管理',icon:'swap-horizontal',roles:['admin','superadmin']},
                {id:'analysis',title:'数据分析',icon:'bar-chart',roles:['admin','superadmin']},
                {id:'profile',title:'个人中心',icon:'person-circle',roles:['user','admin','superadmin']}
            ].filter(p => p.roles.includes(currentUser.value?.role)));

            const myBorrowCount = computed(() => borrowRecords.value.filter(r => r.userId === currentUser.value.id && r.status === 'borrowed').length);
            const myReservationCount = computed(() => borrowRecords.value.filter(r => r.userId === currentUser.value.id && r.status === 'reserved').length);
            const totalBookCount = computed(() => books.value.length);
            const pendingReservations = computed(() => borrowRecords.value.filter(r => r.status === 'reserved'));
            const currentPageTitle = computed(() => visiblePages.value.find(p=>p.id===currentPage.value)?.title || 'LMS');

            return {
                currentUser, loginForm, loginError, currentPage, isSidebarOpen, isLoading, toasts,
                isRegistering, isVerificationStep, isForgotPassword, registerForm, verificationCode, registerError,
                books, filteredBooks, filteredRecords, popularBooks, categoryStats, lowStockBooks,
                myBorrowCount, myReservationCount, totalBookCount, pendingReservations, visiblePages, currentPageTitle,
                isModalOpen, modalType, currentBook, bookSearchQuery, returnBookId, returnUserId,
                profileForm, passwordForm, resetForm, selectedFile,
                handleLogin, handleLogout, handleBorrow, handleReserve, handleRenew, handleReturn,
                handleDeleteBook, handleProcessReservation, handleSaveBook, handleUploadBooks,
                handleUpdateProfile, handleChangePassword, handleExportAnalysis,
                clearErrors, getRoleName, isOverdue, isBookBorrowedByUser, isBookReservedByUser, getBookById, getUserById,
                openBookModal, closeModal, handleFileSelect, handleRegister, handleVerification, handleForgotPassword:()=>{}, handleResetPassword:()=>{}
            };
        }
    }).mount('#app');
</script>
</body>
</html>
